name: DigitalMask checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-build-only-secret-with-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
